<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3D2417"/>
      <stop offset="100%" stop-color="#1A0D07"/>
    </radialGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EBD2"/>
      <stop offset="50%" stop-color="#E5D1B0"/>
      <stop offset="100%" stop-color="#CBB38B"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="#683F25" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Centered Wooden Tile -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="url(#wood)" filter="url(#shadow)"/>
  <rect x="104" y="104" width="304" height="304" rx="42" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6"/>
  <rect x="96" y="96" width="320" height="320" rx="48" fill="none" stroke="#9C7844" stroke-width="3"/>

  <!-- Letter W letterpress -->
  <text x="256" y="300" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="190" font-weight="800" fill="#382112" text-anchor="middle" letter-spacing="-4">W</text>
  
  <!-- Scrabble point value '4' in brass -->
  <circle cx="370" cy="370" r="24" fill="url(#brass)" filter="url(#shadow)"/>
  <text x="370" y="378" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- Mini Grid Indicator Dots -->
  <circle cx="140" cy="140" r="6" fill="#B48635" opacity="0.6"/>
  <circle cx="165" cy="140" r="6" fill="#B48635" opacity="0.6"/>
  <circle cx="190" cy="140" r="6" fill="#B48635" opacity="0.6"/>
</svg>
